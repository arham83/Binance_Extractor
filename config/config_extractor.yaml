# Binance USD-M futures. BTC and ETH become BTCUSDT and ETHUSDT.
market: um
coins: [BTC, ETH]
quote_asset: USDT

# Choose 1m, 3m, 5m, 15m, 30m, 1h, 2h, 4h, 6h, 8h, 12h, or 1d.
interval: 1m
start_date: 2021-01-01
end_date: 2026-08-31
output_format: parquet  # csv is also supported

# Download only candlesticks. Combined trades mode requires 1h + csv.
datasets: [klines]
download_workers: 4
download_retries: 3

# Paths are relative to this YAML file. Each symbol/interval has its own folder.
raw_folder: ../data/raw
preprocessed_folder: ../data/pre_processed
